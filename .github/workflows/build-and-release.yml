name: Build and Release OllamaIdleAdjuster.exe

on:
  push:
    branches:
      - c
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    outputs:
      exe-path: ${{ steps.set-exe-path.outputs.exe-path }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Build main.c to OllamaIdleAdjuster.exe
        id: build
        run: |
          cl /EHsc main.c /Fe:OllamaIdleAdjuster.exe
          echo "::set-output name=exe-path::$(pwd)\\OllamaIdleAdjuster.exe"

      - name: Set exe path output
        id: set-exe-path
        run: echo "::set-output name=exe-path::$(pwd)\\OllamaIdleAdjuster.exe"

      - name: Upload exe artifact
        uses: actions/upload-artifact@v3
        with:
          name: exe
          path: OllamaIdleAdjuster.exe

  release:
    needs: build
    runs-on: ubuntu-latest
    if: success()
    steps:
      - name: Download exe artifact
        uses: actions/download-artifact@v3
        with:
          name: exe
          path: ./release

      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload exe to Release
        uses: softprops/action-gh-release@v1
        with:
          files: ./release/OllamaIdleAdjuster.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
